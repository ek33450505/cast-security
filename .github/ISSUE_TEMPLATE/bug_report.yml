name: Bug Report
description: Report a bug or unexpected behavior in cast-security
labels: [bug]
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: cast-security Version
      placeholder: "e.g. 0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options: [macOS, Linux]
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code Version
      placeholder: "e.g. 1.2.3"
  - type: dropdown
    id: component
    attributes:
      label: Component Involved
      options: [cast-security-guard.sh, cast-permission-hook.sh, cast-audit-hook.sh, cast-redact.py, pre-tool-guard.sh, cast-headless-guard.sh, policies.json, pii-patterns.json, other]
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: audit-log
    attributes:
      label: Audit Log Output
      description: Paste relevant lines from cast-security-audit.jsonl
  - type: textarea
    id: context
    attributes:
      label: Additional Context
